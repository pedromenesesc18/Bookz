<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookz</title>
<meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bookz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe6; --card:#fffaf4; --ink:#2b211b; --muted:#8a7a6d; --line:#eadfd2;
  --accent:#b5543c; --accent-soft:#f3dcd3; --star:#e8a33d; --chip:#efe4d7;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1714;--card:#27201b;--ink:#f3e9df;--muted:#a5968a;--line:#3a302a;
  --accent:#e07a5f;--accent-soft:#4a2c24;--star:#f0b453;--chip:#332a24;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
body{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
main{padding:0 16px;max-width:640px;margin:0 auto}
.years{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Fraunces,serif;font-size:24px}
.stat small{color:var(--muted);font-size:12px}
.month{font-family:Fraunces,serif;font-size:18px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;text-transform:capitalize}
.month small{font-family:Inter;color:var(--muted);font-size:13px;text-transform:none}
.list{display:flex;flex-direction:column;gap:10px}
.book{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.cover{flex:none;width:54px;height:80px;border-radius:6px;background:var(--accent-soft);object-fit:cover;display:grid;place-items:center;font-family:Fraunces,serif;color:var(--accent);font-size:22px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.binfo{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.btitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bauthor{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--star);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-top:2px;width:max-content}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font-size:44px;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 8px;min-width:62px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:20px;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(181,84,60,.4);display:grid;place-items:center}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:Fraunces,serif;margin:0 0 12px;font-size:22px}
.search{display:flex;gap:8px;margin-bottom:10px}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.field:focus{border-color:var(--accent)}
label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.starpick{display:flex;gap:4px}
.starpick button{font-size:34px;color:var(--line);line-height:1;padding:0 2px}
.starpick button.on{color:var(--star)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:14px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;margin-top:20px;font-size:16px}
.ghost{width:100%;padding:12px;border-radius:14px;color:var(--accent);font-weight:500;margin-top:8px}
.danger{color:#c0392b}
.results{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.results .book{box-shadow:none;border:1px solid var(--line)}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:10px}
.preview{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.preview .cover{width:64px;height:96px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.searchbar{margin-bottom:12px}
.sort{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.sort select{background:none;border:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Book<span>z</span></h1>
  <div style="display:flex;gap:4px">
    <button class="iconbtn" id="btnFind" aria-label="Buscar"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m20 20-5-5"/></svg></button>
    <button class="iconbtn" id="btnMenu" aria-label="Backup"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="5" r="1.2"/><circle cx="11" cy="11" r="1.2"/><circle cx="11" cy="17" r="1.2"/></svg></button>
  </div>
</header>
<main id="view"></main>

<button class="fab" id="fab" aria-label="Adicionar livro">+</button>

<nav id="nav">
  <button data-tab="lidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24"/><path d="m9 10 2 2 4-4"/></svg>Lidos</button>
  <button data-tab="lendo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>Lendo</button>
  <button data-tab="quero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>Quero ler</button>
  <button data-tab="estante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V5h3v16M10 21V3h3v18M15.5 21l-1-14 3-.4 2 14"/></svg>Estante</button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const KEY='bookz.v1';
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const authors=a=>{const seen=new Set();return (a||[]).filter(x=>{const k=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).join(', ')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let books=load();
let tab=(()=>{try{return localStorage.getItem('bookz.tab')||'lidos'}catch{return 'lidos'}})();
let year=null, query='', showSearch=false;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch{toast('Não consegui salvar 😕')}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

function stars(n){if(!n)return '';let s='';for(let i=1;i<=5;i++)s+=i<=n?'★':'<span class="off">★</span>';return `<span class="stars">${s}</span>`}
function coverHTML(b){return `<div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.remove()">`:''}${b.cover?'':esc((b.title||'?')[0])}</div>`}
function card(b,extra=''){return `<button class="book" data-id="${b.id}">${coverHTML(b)}<div class="binfo"><div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author||'')}</div>${stars(b.rating)}${extra}</div></button>`}
function empty(icon,msg){return `<div class="empty"><div class="big">${icon}</div>${msg}</div>`}
function matches(b){if(!query)return true;const q=query.toLowerCase();return (b.title+' '+(b.author||'')).toLowerCase().includes(q)}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=$('#view');
  const search=showSearch?`<div class="searchbar"><input class="field" id="q" value="${esc(query)}" placeholder="Buscar nos seus livros"></div>`:'';
  if(tab==='lidos') v.innerHTML=search+renderLidos();
  else if(tab==='lendo'){
    const l=books.filter(b=>b.status==='lendo'&&matches(b));
    v.innerHTML=search+(l.length?`<div class="list">${l.map(b=>card(b,b.startedAt?`<span class="bauthor">desde ${fmtDate(b.startedAt)}</span>`:'')).join('')}</div>`:empty('📖','Nenhum livro em andamento.<br>Toque no + pra começar um.'));
  } else if(tab==='quero'){
    const l=books.filter(b=>b.status==='quero'&&matches(b)).sort((a,b)=>(b.fisico-a.fisico)||a.title.localeCompare(b.title));
    v.innerHTML=search+(l.length?`<p class="bauthor" style="margin:0 2px 10px">${l.length} ${l.length>1?'livros':'livro'} na lista</p><div class="list">${l.map(b=>card(b,b.fisico?'<span class="tag">tenho físico</span>':'')).join('')}</div>`:empty('💭','Sua lista de desejos tá vazia.'));
  } else {
    const l=books.filter(b=>b.fisico&&b.status!=='lido'&&matches(b)).sort((a,b)=>a.title.localeCompare(b.title));
    const total=books.filter(b=>b.fisico).length;
    v.innerHTML=search+(l.length?`<div class="summary"><div class="stat"><b>${l.length}</b><small>pra ler</small></div><div class="stat"><b>${total-l.length}</b><small>já lidos</small></div><div class="stat"><b>${total}</b><small>na estante</small></div></div><div class="list">${l.map(b=>card(b,b.status==='lendo'?'<span class="tag">lendo agora</span>':'')).join('')}</div>`:empty('📚','Nenhum livro físico esperando.<br>Marque “tenho físico” ao adicionar.'));
  }
  const q=$('#q'); if(q){q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
}

function fmtDate(d){const [y,m,dd]=d.split('-');return `${+dd} de ${MONTHS[+m-1]}`}

function renderLidos(){
  const lidos=books.filter(b=>b.status==='lido');
  if(!lidos.length) return empty('✨','Nenhum livro lido ainda.<br>Toque no + pra adicionar o primeiro.');
  const years=[...new Set(lidos.map(b=>(b.finishedAt||'????').slice(0,4)))].sort().reverse();
  if(!year||!years.includes(year)) year=years[0];
  const ys=lidos.filter(b=>(b.finishedAt||'????').slice(0,4)===year&&matches(b));
  const rated=ys.filter(b=>b.rating);
  const avg=rated.length?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):'–';
  const pages=ys.reduce((s,b)=>s+(+b.pages||0),0);
  let h=`<div class="years">${years.map(y=>`<button class="chip ${y===year?'on':''}" data-year="${y}">${y==='????'?'Sem data':y}</button>`).join('')}</div>
  <div class="summary"><div class="stat"><b>${ys.length}</b><small>${ys.length===1?'livro':'livros'}</small></div><div class="stat"><b>${pages?pages.toLocaleString('pt-BR'):'–'}</b><small>páginas</small></div><div class="stat"><b>${avg}${avg!=='–'?'<span style="color:var(--star);font-size:18px"> ★</span>':''}</b><small>nota média</small></div></div>`;
  const byMonth={};
  ys.forEach(b=>{const m=b.finishedAt?b.finishedAt.slice(5,7):'??';(byMonth[m]=byMonth[m]||[]).push(b)});
  Object.keys(byMonth).sort().reverse().forEach(m=>{
    const l=byMonth[m].sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||''));
    h+=`<div class="month">${m==='??'?'sem mês':MONTHS[+m-1]}<small>${l.length} ${l.length>1?'livros':'livro'}</small></div><div class="list">${l.map(b=>card(b)).join('')}</div>`;
  });
  return h;
}

/* ---------- sheet ---------- */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('open');$('#backdrop').classList.add('open');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('open');$('#backdrop').classList.remove('open')}
$('#backdrop').onclick=closeSheet;

function openAdd(){
  openSheet(`<h2>Adicionar livro</h2>
  <div class="search"><input class="field" id="s" placeholder="Título, autor ou ISBN" enterkeyhint="search" autocomplete="off"></div>
  <div id="res" class="results"></div>
  <button class="ghost" id="manual">Adicionar manualmente</button>`);
  const s=$('#s');let t;
  s.oninput=()=>{clearTimeout(t);t=setTimeout(()=>doSearch(s.value),450)};
  s.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(t);doSearch(s.value);s.blur()}};
  $('#manual').onclick=()=>openEdit({title:s.value});
  setTimeout(()=>s.focus(),250);
}

let lastResults=[];
async function doSearch(q){
  q=q.trim();const res=$('#res');if(!res)return;
  if(q.length<2){res.innerHTML='';return}
  res.innerHTML='<div class="hint">Buscando…</div>';
  let items=[];
  try{
    const r=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=12&printType=books&q='+encodeURIComponent(q));
    const j=await r.json();
    items=(j.items||[]).map(it=>{const v=it.volumeInfo||{};return{title:v.title+(v.subtitle?': '+v.subtitle:''),author:authors(v.authors),pages:v.pageCount||'',cover:(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','')}});
  }catch{}
  if(!items.length){
    try{
      const r=await fetch('https://openlibrary.org/search.json?limit=12&fields=title,author_name,cover_i,number_of_pages_median&q='+encodeURIComponent(q));
      const j=await r.json();
      items=(j.docs||[]).map(d=>({title:d.title,author:authors(d.author_name),pages:d.number_of_pages_median||'',cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:''}));
    }catch{}
  }
  if(!$('#res'))return;
  lastResults=items;
  res.innerHTML=items.length?items.map((b,i)=>`<button class="book" data-r="${i}">${coverHTML(b)}<div class="binfo"><div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author)}</div>${b.pages?`<div class="bauthor">${b.pages} páginas</div>`:''}</div></button>`).join(''):'<div class="hint">Nada encontrado. Tente adicionar manualmente.</div>';
}

function openEdit(b){
  const isNew=!b.id;
  const d={status:tab==='quero'?'quero':tab==='lendo'?'lendo':'lido',fisico:tab==='estante',rating:0,finishedAt:today(),...b};
  if(tab==='estante'&&isNew)d.status='quero';
  openSheet(`<div class="preview">${coverHTML(d)}<div class="binfo"><h2 style="margin:0;font-size:19px">${isNew?'Novo livro':'Editar livro'}</h2></div></div>
  <label class="l">Título</label><input class="field" id="f_title" value="${esc(d.title)}">
  <label class="l">Autor(a)</label><input class="field" id="f_author" value="${esc(d.author)}">
  <label class="l">Status</label>
  <div class="seg" id="f_status">${[['lido','Lido'],['lendo','Lendo'],['quero','Quero ler']].map(([k,l])=>`<button data-v="${k}" class="${d.status===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="toggle"><span>📚 Tenho o livro físico</span><button class="switch ${d.fisico?'on':''}" id="f_fisico" aria-label="Tenho físico"></button></div>
  <div id="lidoBox">
    <label class="l">Nota</label>
    <div class="starpick" id="f_rating">${[1,2,3,4,5].map(i=>`<button data-v="${i}" class="${i<=d.rating?'on':''}">★</button>`).join('')}</div>
    <label class="l">Terminei em</label><input type="date" class="field" id="f_finished" value="${esc(d.finishedAt||'')}">
  </div>
  <div id="lendoBox"><label class="l">Comecei em</label><input type="date" class="field" id="f_started" value="${esc(d.startedAt||today())}"></div>
  <label class="l">Páginas</label><input class="field" id="f_pages" inputmode="numeric" value="${esc(d.pages)}">
  <label class="l">Anotações</label><textarea class="field" id="f_notes" rows="3" placeholder="O que achou? Frases favoritas…">${esc(d.notes)}</textarea>
  <button class="primary" id="saveBtn">${isNew?'Adicionar':'Salvar'}</button>
  ${isNew?'':'<button class="ghost danger" id="delBtn">Remover livro</button>'}`);
  let status=d.status,fisico=!!d.fisico,rating=d.rating||0;
  const sync=()=>{$('#lidoBox').style.display=status==='lido'?'':'none';$('#lendoBox').style.display=status==='lendo'?'':'none'};sync();
  $('#f_status').onclick=e=>{const v=e.target.dataset.v;if(!v)return;status=v;[...$('#f_status').children].forEach(c=>c.classList.toggle('on',c.dataset.v===v));sync()};
  $('#f_fisico').onclick=e=>{fisico=!fisico;e.currentTarget.classList.toggle('on',fisico)};
  $('#f_rating').onclick=e=>{const v=+e.target.dataset.v;if(!v)return;rating=rating===v?0:v;[...$('#f_rating').children].forEach(c=>c.classList.toggle('on',+c.dataset.v<=rating))};
  $('#saveBtn').onclick=()=>{
    const title=$('#f_title').value.trim();if(!title){$('#f_title').focus();return}
    const nb={...d,id:d.id||uid(),title,author:$('#f_author').value.trim(),status,fisico,rating:status==='lido'?rating:(d.rating||0),
      finishedAt:status==='lido'?$('#f_finished').value:'',startedAt:status==='lendo'?$('#f_started').value:(d.startedAt||''),
      pages:$('#f_pages').value.replace(/\D/g,''),notes:$('#f_notes').value.trim(),addedAt:d.addedAt||today()};
    const i=books.findIndex(x=>x.id===nb.id);if(i>=0)books[i]=nb;else books.push(nb);
    save();closeSheet();
    if(status==='lido'&&nb.finishedAt)year=nb.finishedAt.slice(0,4);
    if(isNew){tab=status;setTab(status)}else render();
    toast(isNew?'Livro adicionado ✨':'Salvo');
  };
  if(!isNew)$('#delBtn').onclick=()=>{if(confirm('Remover “'+d.title+'”?')){books=books.filter(x=>x.id!==d.id);save();closeSheet();render();toast('Removido')}};
}

function openMenu(){
  openSheet(`<h2>Seus dados</h2>
  <p class="bauthor" style="white-space:normal">Os livros ficam salvos só neste aparelho. Faça um backup de vez em quando pra não perder nada.</p>
  <button class="primary" id="exp">Exportar backup</button>
  <button class="ghost" id="imp">Importar backup</button>
  <p class="hint">${books.length} livros cadastrados</p>`);
  $('#exp').onclick=async()=>{
    const data=JSON.stringify({app:'bookz',version:1,exportedAt:new Date().toISOString(),books},null,2);
    const file=new File([data],`bookz-backup-${today()}.json`,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Backup Bookz'});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();
  };
  $('#imp').onclick=()=>$('#importFile').click();
}
$('#importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.books;if(!Array.isArray(list))throw 0;
    const ids=new Set(books.map(b=>b.id));let n=0;list.forEach(b=>{if(b&&b.title&&!ids.has(b.id)){books.push({id:b.id||uid(),...b});n++}});
    save();closeSheet();render();toast(n+' livros importados');
  }catch{toast('Arquivo inválido')}
  e.target.value='';
};

function setTab(t){tab=t;try{localStorage.setItem('bookz.tab',t)}catch{}render();window.scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
$('#fab').onclick=openAdd;
$('#btnMenu').onclick=openMenu;
$('#btnFind').onclick=()=>{showSearch=!showSearch;query='';render();if(showSearch)$('#q').focus()};
$('#view').onclick=e=>{
  const y=e.target.closest('[data-year]');if(y){year=y.dataset.year;render();return}
  const b=e.target.closest('.book[data-id]');if(b)openEdit(books.find(x=>x.id===b.dataset.id));
};
$('#sheetBody').onclick=e=>{const r=e.target.closest('[data-r]');if(r)openEdit({...lastResults[+r.dataset.r]})};

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
