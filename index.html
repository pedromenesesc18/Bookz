<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.googleapis.com https://openlibrary.org; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Bookz</title>
    <meta name="description" content="Meus livros: lidos, lendo, quero ler e estante." />
    <meta name="theme-color" content="#f6efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bookz" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/sheet.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-row">
        <h1 class="logo">Book<span>z</span></h1>
        <div class="header-actions">
          <button
            type="button"
            class="icon-btn"
            data-action="search"
            aria-label="Buscar nos meus livros"
          >
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
          </button>
          <button type="button" class="icon-btn" data-action="menu" aria-label="Backup e dados">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5h.01M12 12h.01M12 19h.01" />
            </svg>
          </button>
        </div>
      </div>
      <div class="search-bar" id="search-bar" role="search" hidden>
        <label class="sr-only" for="q">Buscar nos seus livros</label>
        <input
          class="field"
          id="q"
          type="search"
          placeholder="Buscar nos seus livros"
          autocomplete="off"
        />
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <button type="button" class="fab" data-action="add" aria-label="Adicionar livro">
      <svg
        viewBox="0 0 24 24"
        width="28"
        height="28"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <nav class="bottom-nav" id="nav" aria-label="Seções"></nav>

    <div class="backdrop" id="backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="grab" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
  </body>
</html>
